name: P0 Web App Check

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/p0-webapp-check.yml"
  push:
    branches:
      - "feat/p0-internal-ops-shell"
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/p0-webapp-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
