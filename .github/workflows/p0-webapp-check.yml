name: P0 Web App Check

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/p0-webapp-check.yml"
  push:
    branches:
      - "feat/p0-internal-ops-shell"
      - "feat/pwa-v0-1-founder-usable"
      - "feat/p0-official-read-bind"
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/p0-webapp-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built-server Official Read V1 smoke
        run: |
          npm start > /tmp/myc-next.log 2>&1 &
          echo $! > /tmp/myc-next.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:endpoints
          kill $(cat /tmp/myc-next.pid) || true
